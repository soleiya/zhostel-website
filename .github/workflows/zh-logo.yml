name: Hero logo fix
on:
  push:
    paths: ["_incoming/zh_logo_fix.py"]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python3 _incoming/zh_logo_fix.py
          python3 build_site.py
          python3 pages_booking.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q _incoming .github/workflows/zh-logo.yml
          git add -A
          git commit -q -m "Hero logo: white Z on black (the PNG's Z is transparent); rebuild pages"
          git push
