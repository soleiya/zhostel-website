name: Home hero update (entrance photo, logo, building shot)
on:
  push:
    paths: ["_incoming/zh_hero_patch.py"]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Patch and rebuild all pages
        run: |
          pip install -q pillow 2>/dev/null || true
          python3 _incoming/zh_hero_patch.py
          python3 build_site.py
          python3 pages_booking.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q _incoming .github/workflows/zh-hero.yml
          git add -A
          git commit -q -m "Home: Good Vibes Only hero on the entrance photo, striped Z logo, building shot in Getting There; rebuild pages with photos"
          git push
